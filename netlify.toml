[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/verify_hostinger/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/2026/*"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
