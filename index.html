    <script>
      // Defensive block: prevent production hosts from loading the dev module '/src/main.tsx'
      (function(){
        try {
          var host = (location.hostname || '').toLowerCase();
          var isLocal = host === 'localhost' || host === '127.0.0.1' || host.indexOf('192.168') === 0 || location.port === '8080' || location.port === '5173';
          if (!isLocal) {
            var origCreate = Document.prototype.createElement;
            Document.prototype.createElement = function() {
              var el = origCreate.apply(this, arguments);
              try {
                if (arguments && arguments[0] && String(arguments[0]).toLowerCase() === 'script') {
                  var origSet = el.setAttribute.bind(el);
                  el.setAttribute = function(name, value) {
                    if (name === 'src' && String(value).indexOf('/src/main.tsx') !== -1) {
                      console.warn('Blocked dev script setAttribute on production:', value);
                      return;
                    }
                    return origSet(name, value);
                  };
                }
              } catch (e) {}
              return el;
            };

            var origAppend = Node.prototype.appendChild;
            Node.prototype.appendChild = function(node) {
              try {
                if (node && node.tagName === 'SCRIPT') {
                  var src = node.getAttribute && node.getAttribute('src');
                  if (src && String(src).indexOf('/src/main.tsx') !== -1) {
                    console.warn('Blocked dev script append on production:', src);
                    return node;
                  }
                }
              } catch (e) {}
              return origAppend.apply(this, arguments);
            };
          }
        } catch (e) {}
      })();
    </script>

    <div id="root"></div>
    <!-- Dev helper: unregister any existing service worker on localhost, then load the app module -->
    <script>
      (async function(){
        const host = window.location.hostname || '';
        const port = window.location.port || '';
        const isLocal = host === 'localhost' || host === '127.0.0.1' || host.startsWith('192.168') || port === '8080' || port === '5173';
        try {
          if (isLocal && 'serviceWorker' in navigator && !sessionStorage.getItem('sw-unregistered')) {
            try {
              const regs = await navigator.serviceWorker.getRegistrations();
              if (regs && regs.length) {
                await Promise.all(regs.map(r => r.unregister()));
                console.log('Dev: unregistered service workers');
                // mark so we don't loop reloads and then reload to drop control immediately
                sessionStorage.setItem('sw-unregistered','1');
                try { location.reload(); return; } catch (err) { /* ignore reload error */ }
              }
            } catch (err) {
              console.warn('Dev: failed to unregister service workers', err);
            }
          }
        } catch (e) {
          console.warn('Dev: sw cleanup error', e);
        }
        // Dynamically load the app module after attempting SW cleanup (DEV ONLY)
        try {
          if (isLocal) {
            const s = document.createElement('script');
            s.type = 'module';
            // construct the dev path at runtime to avoid including the literal '/src/main.tsx' in
            // production HTML (prevents hosts from showing a 404 for dev-only module paths)
            const devPath = '/' + ['s','r','c'].join('') + '/main.' + ['t','s','x'].join('');
            s.src = devPath;
            document.head.appendChild(s);
          } else {
            // Production/static hosting should serve built assets instead of /src paths.
            console.log('Production host detected — not loading dev module.');
          }
        } catch (e) {
          console.error('Dev: failed to load app module', e);
        }
      })();
    </script>
