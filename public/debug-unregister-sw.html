<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Debug — Unregister Service Workers</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>body{font-family:Inter,system-ui,Segoe UI,Roboto,-apple-system,Arial;background:#0b1220;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0} .card{max-width:720px;padding:28px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,0.04),rgba(255,255,255,0.02));text-align:center}</style>
  </head>
  <body>
    <div class="card">
      <h1>Cleaning Service Workers...</h1>
      <p>If successful you'll be redirected back to the app automatically.</p>
      <pre id="out" style="text-align:left;margin-top:16px;color:#9fb2ff;background:#061022;padding:12px;border-radius:8px;max-height:220px;overflow:auto"></pre>
    </div>

    <script>
      (async function(){
        const out = (t)=>{ const el=document.getElementById('out'); el.textContent += '\n' + t };
        try{
          if (!('serviceWorker' in navigator)){
            out('No serviceWorker support in this browser. Redirecting...');
            setTimeout(()=>location.replace('/'),1200);
            return;
          }
          out('Locating registrations...');
          const regs = await navigator.serviceWorker.getRegistrations();
          if (!regs || regs.length === 0){
            out('No registrations found. Redirecting...');
            setTimeout(()=>location.replace('/'),900);
            return;
          }
          out('Found ' + regs.length + ' registration(s). Unregistering...');
          for (const r of regs){
            out('Unregistering scope: ' + (r.scope || '(unknown)'));
            const ok = await r.unregister();
            out('-> ' + (ok ? 'success' : 'failed'));
          }
          out('Done. Reloading root...');
          setTimeout(()=>location.replace('/'),900);
        }catch(e){ out('Error: '+(e && e.message || String(e))); setTimeout(()=>location.replace('/'),1500); }
      })();
    </script>
  </body>
</html>
