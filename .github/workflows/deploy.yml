name: Build and deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy magazine PDF into dist (if present)
        run: |
          if [ -f assets_backup/NEXUS_MAGAZINE.pdf ]; then
            cp assets_backup/NEXUS_MAGAZINE.pdf dist/NEXUS_MAGAZINE.pdf;
            echo "Copied NEXUS_MAGAZINE.pdf into dist/";
          else
            echo "No PDF found in assets_backup/; skipping copy";
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
